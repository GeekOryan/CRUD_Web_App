{% extends "base.html" %}

{% block content %}
<h1>Create New Note</h1>
<div class="form-card">
  <form method="POST">
    <div class="form-group">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" value="{{ title or '' }}">
    </div>
    <div class="form-group">
      <label for="content">Content</label>
      <textarea id="content" name="content">{{ content or '' }}</textarea>
    </div>
    
    <div class="form-group">
      <label for="tags">Tags (comma separated)</label>
      <input 
        type="text" 
        id="tags" 
        name="tags" 
        placeholder="e.g. work, python, urgent"
        class="w-full px-4 py-2 border border-gray-200 rounded-lg text-gray-700 text-sm focus:outline-none focus:border-blue-400"
      >
    </div>
    <div class="form-actions">
      <button type="submit">Save Note</button>
      <a href="{{ url_for('index') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
