{% extends "base.html" %}

{% block content %}
<h1>Edit Note</h1>
<div class="form-card">
<form method="POST">
    <div>
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" value="{{ note['title'] }}">
    </div>
    <div>
        <label for="content">Content:</label>
        <textarea id="content" name="content">{{ note['content'] }}</textarea>
    </div>
    <div class="form-group">
        <label for="tags">Tags (comma separated)</label>
        <input
            type="text"
            id="tags"
            name="tags"
            value="{{ tag_string or '' }}"
            placeholder="e.g. work, python, urgent"
            class="w-full px-4 py-2 border border-gray-200 rounded-lg text-gray-700 text-sm focus:outline-none focus:border-blue-400">
    </div>
    <button type="submit">Update Note</button>
    <a href="{{ url_for('index') }}">Cancel</a>
</form>
</div>
{% endblock %}
