{% extends "base.html" %}

{% block content %}
<h1 class="text-2xl font-bold mb-6">Import Notes</h1>

<div class="form-card">
    <p class="text-sm mb-6" style="color: var(--text-muted)">
        Supported formats: Markdown (.md), Plain Text (.txt),
        Google Keep (.json), Notion (.csv), Samsung Notes (.enex),
        Apple Notes (.txt), OneNote (.html)
    </p>

    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label for="file">Choose a file to import</label>
            <input
                type="file"
                id="file"
                name="file"
                accept=".md,.txt,.json,.csv,.enex,.html"
                style="color: var(--text); background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; width: 100%;"
            >
        </div>
        <div class="form-actions">
            <button tyoe="submit">Import</button>
            <a href="{{ url_for('index') }}">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
