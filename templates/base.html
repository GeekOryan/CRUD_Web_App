<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <script>
        const saved = localStorage.getItem('theme') || 'light';
        document.documentElement.classList.add(saved);
    </script>
    <script>tailwind = { config: { darkMode: 'class' } }</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<canvas id="fluid-canvas"></canvas>

<!-- NAVBAR -->
<nav>
    <a href="{{ url_for('index') }}" class="nav-brand">
        <div class="nav-brand-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
        </div>
        <span class="nav-brand-text">Notes</span>
    </a>

    <div class="nav-links">
        <a href="{{ url_for('index') }}" class="nav-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
            </svg>
            All Notes
        </a>
        <a href="{{ url_for('create') }}" class="nav-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="16"/>
                <line x1="8" y1="12" x2="16" y2="12"/>
            </svg>
            New Note
        </a>
        <a href="{{ url_for('import_notes') }}" class="nav-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
            Import
        </a>
        <div class="nav-divider"></div>
        <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">
            <svg id="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <svg id="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
        </button>
    </div>
</nav>

<!-- FLASH MESSAGES -->
<div class="flash-container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
</div>

<!-- MAIN CONTENT -->
<div class="container">
    {% block content %}{% endblock %}
</div>

<script>
// ===== FLUID BACKGROUND =====
const canvas = document.getElementById('fluid-canvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);
const isDark = () => document.documentElement.classList.contains('dark');
const colorSets = {
    light: [{r:219,g:234,b:254},{r:237,g:233,b:254},{r:209,g:250,b:229},{r:224,g:231,b:255},{r:252,g:231,b:243}],
    dark:  [{r:15,g:23,b:60},{r:30,g:10,b:60},{r:5,g:40,b:30},{r:20,g:10,b:50},{r:40,g:5,b:30}]
};
const blobs = [{x:.2,y:.2,r:.55},{x:.8,y:.3,r:.48},{x:.5,y:.7,r:.52},{x:.1,y:.8,r:.40},{x:.9,y:.85,r:.45}];
blobs.forEach((b,i) => {
    gsap.to(b,{x:Math.random(),y:Math.random(),duration:8+i*2,ease:'sine.inOut',yoyo:true,repeat:-1,delay:i*1.2});
    gsap.to(b,{r:b.r+.15,duration:5+i*1.5,ease:'sine.inOut',yoyo:true,repeat:-1,delay:i*.8});
});
function drawFluid() {
    ctx.clearRect(0,0,W,H);
    const colors = isDark() ? colorSets.dark : colorSets.light;
    ctx.fillStyle = isDark() ? '#060611' : '#f0f4ff';
    ctx.fillRect(0,0,W,H);
    blobs.forEach((b,i) => {
        const c=colors[i],x=b.x*W,y=b.y*H,r=b.r*Math.max(W,H);
        const g=ctx.createRadialGradient(x,y,0,x,y,r);
        g.addColorStop(0,`rgba(${c.r},${c.g},${c.b},${isDark()?.5:.7})`);
        g.addColorStop(1,`rgba(${c.r},${c.g},${c.b},0)`);
        ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    });
    requestAnimationFrame(drawFluid);
}
drawFluid();

// ===== GSAP CARD ANIMATIONS =====
document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.note-card').forEach((card, i) => {
        gsap.to(card,{y:-8,duration:2.8+i*.6,ease:'sine.inOut',yoyo:true,repeat:-1,delay:i*.9});
        gsap.to(card,{boxShadow:isDark()?'0 0 28px rgba(59,130,246,0.15)':'0 0 28px rgba(59,130,246,0.08)',duration:2.2+i*.5,ease:'sine.inOut',yoyo:true,repeat:-1,delay:i*1.1});
    });
    document.querySelectorAll('.shimmer-sweep').forEach((el, i) => {
        updateShimmer(el);
        gsap.fromTo(el,{left:'-60%'},{left:'150%',duration:1.6,ease:'power1.inOut',repeat:-1,repeatDelay:3,delay:i*1.4});
    });
    updateThemeIcons();
});

function updateShimmer(el) {
    el.style.background = isDark()
        ? 'linear-gradient(90deg,transparent,rgba(255,255,255,0.06),rgba(147,197,253,0.1),rgba(255,255,255,0.06),transparent)'
        : 'linear-gradient(90deg,transparent,rgba(59,130,246,0.07),rgba(255,255,255,0.2),rgba(59,130,246,0.07),transparent)';
}

// ===== THEME =====
function toggleTheme() {
    const dark = isDark();
    document.documentElement.classList.toggle('dark');
    document.documentElement.classList.toggle('light');
    localStorage.setItem('theme', dark ? 'light' : 'dark');
    document.querySelectorAll('.shimmer-sweep').forEach(updateShimmer);
    updateThemeIcons();
}

function updateThemeIcons() {
    const dark = isDark();
    document.getElementById('moon-icon').style.display = dark ? 'none' : 'block';
    document.getElementById('sun-icon').style.display = dark ? 'block' : 'none';
}
</script>

</body>
</html>
